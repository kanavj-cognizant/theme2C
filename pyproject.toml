[project]
name = "risk-map"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Core Data & Modeling
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "uncertainties>=3.1.7",
    "networkx>=3.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.10.0",
    # Spatial Engine
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    "momepy>=0.9.0",
    "whitebox-workflows>=2.0.0",
    "elevatr>=0.3.0",
    "rasterio>=1.4.0",
    "rioxarray>=0.15.0",
    # Utilities & Legacy Compatibility
    "requests>=2.30.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
    "fuzzywuzzy>=0.18.0",
    "osgridconverter>=0.1.3",
    "branca>=0.8.2",
    "folium>=0.20.0",
    "matplotlib>=3.10.9",
    "mapclassify>=2.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "plotly>=7.1.0",
    "nbformat>=5.11.1",
    "ipywidgets>=8.1.9",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "legacy: slow legacy pipeline characterization tests (run on demand)",
    "integration: real Whitebox/elevation runs on fixture catchments (run on demand)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line-too-long handled by ruff format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
